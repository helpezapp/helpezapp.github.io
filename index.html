<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ezapp</title>
<style>
  :root{
    color-scheme: light dark;
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e6e6e6;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #111214;
      --card: #191a1d;
      --border: #2a2b2e;
      --text: #f0f0f0;
      --muted: #9a9a9a;
      --accent: #6ea0ff;
    }
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }
  header{
    margin-bottom: 40px;
  }
  header h1{
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header p{
    margin:0;
    color: var(--muted);
    font-size: 15px;
  }
  .app-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .app-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .app-icon{
    flex:0 0 auto;
    width:48px;
    height:48px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    background: linear-gradient(135deg, var(--accent), #7b5cff);
    color:#fff;
  }
  .app-body{
    flex:1 1 auto;
    min-width:0;
  }
  .app-body h2{
    font-size:16px;
    margin:0 0 3px;
  }
  .app-body p{
    margin:0;
    font-size:13.5px;
    color:var(--muted);
  }
  .app-links{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
    font-size:12.5px;
  }
  .app-links a{
    color:var(--accent);
    text-decoration:none;
  }
  .app-links a:hover{ text-decoration:underline; }
  .app-links .dim{
    color:var(--muted);
  }
  footer{
    margin-top:48px;
    padding-top:24px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:13px;
  }
  footer a{ color:var(--accent); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ezapp</h1>
      <p>쓸 것만 남긴, 작고 가벼운 유틸리티 앱들을 만듭니다.</p>
    </header>

    <div class="app-list" id="appList"></div>

    <footer>
      문의: <a href="mailto:help.ezapp@gmail.com">help.ezapp@gmail.com</a>
    </footer>
  </div>

  <script>
    // 앱 추가할 때 이 배열에 한 줄만 추가하면 됩니다. (package만 있으면 playUrl은 자동 생성)
    const APPS = [
      {
        icon: "🧮",
        name: "Calculator",
        desc: "베이직 · 공학용 · 퍼센트 계산기를 한 앱에",
        package: "com.ezapp.calculator",
        privacyUrl: "https://helpezapp.github.io/privacy-policy/calculator.html",
      },
      {
        icon: "🛒",
        name: "Shopping List",
        desc: "장보기 목록 · 할 일 목록 · 체크리스트",
        package: "co.kr.ezapp.shoppinglist",
        privacyUrl: "https://helpezapp.github.io/privacy-policy/shopping-list.html",
      },
      {
        icon: "⌨️",
        name: "Fidget Keyboard",
        desc: "탭감 좋은 클릭 콤보로 가볍게 스트레스 해소",
        package: "com.ezapp.clicker",
        privacyUrl: "https://helpezapp.github.io/privacy-policy/fidget-keyboard.html",
      },
      {
        icon: "💱",
        name: "Currency Converter",
        desc: "실시간 환율로 빠르게 환전 계산",
        package: "com.ezapp.currencyconverter",
        privacyUrl: "https://helpezapp.github.io/privacy-policy/currency-converter.html",
      },
      {
        icon: "🥦",
        name: "StillGood?",
        desc: "유통기한을 추적하고 음식물 낭비를 줄여요",
        package: "com.ezapp.stillgood",
        // privacyUrl 없음 — 앱 안에서 바로 보여주는 방식이라 별도 호스팅 페이지가 없음
      },
      // 👉 새 앱 추가 예시:
      // {
      //   icon: "🎯",
      //   name: "새 앱 이름",
      //   desc: "한 줄 설명",
      //   package: "com.ezapp.newapp",
      //   privacyUrl: "https://helpezapp.github.io/privacy-policy/new-app.html",
      // },
    ];

    const list = document.getElementById("appList");
    for (const app of APPS) {
      const card = document.createElement("div");
      card.className = "app-card";

      const playUrl = "https://play.google.com/store/apps/details?id=" + app.package;
      const privacyLink = app.privacyUrl
        ? `<a class="dim" href="${app.privacyUrl}">개인정보처리방침</a>`
        : "";

      card.innerHTML = `
        <div class="app-icon">${app.icon}</div>
        <div class="app-body">
          <h2>${app.name}</h2>
          <p>${app.desc}</p>
        </div>
        <div class="app-links">
          <a href="${playUrl}">Play 스토어</a>
          ${privacyLink}
        </div>
      `;
      list.appendChild(card);
    }
  </script>
</body>
</html>
